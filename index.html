<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6fed" />
  <meta name="application-name" content="Forever" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Forever" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png" />
  <title>Forever</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="loading-mark"><img src="assets/icon-192.png" alt="Forever" /></div>
  </div>

  <!-- LOGIN -->
  <main id="login-screen" class="auth-screen hidden">
    <section class="auth-card">
      <div class="brand-mark"><img src="assets/icon-192.png" alt="Forever" /></div>
      <h1>Forever</h1>
      <p class="auth-subtitle">A private place for your conversations.</p>

      <form id="login-form" autocomplete="on">
        <label>
          <span>Email</span>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </label>

        <label>
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required placeholder="Your password" />
        </label>

        <p id="login-error" class="form-error hidden"></p>

        <button id="login-button" type="submit" class="primary-button">
          <span>Log in</span>
          <span class="button-loader hidden"></span>
        </button>
      </form>
    </section>
  </main>

  <!-- MESSENGER -->
  <main id="messenger-screen" class="messenger hidden">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <img class="brand-app-icon" src="assets/icon-192.png" alt="Forever app icon" width="34" height="34" />
          <span>Forever</span>
        </div>
        <button id="logout-button" class="icon-button" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 7V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2v-2"></path>
            <path d="M15 12H3"></path>
            <path d="m6 9-3 3 3 3"></path>
          </svg>
        </button>
      </header>

      <div class="sidebar-label">Messages</div>

      <div id="conversation-list" class="conversation-list">
        <button id="conversation-item" class="conversation-item">
          <div id="contact-avatar" class="avatar">?</div>
          <div class="conversation-copy">
            <div class="conversation-topline">
              <strong id="contact-name">Loading...</strong>
              <time id="last-message-time"></time>
            </div>
            <p id="last-message-preview">Loading conversation...</p>
          </div>
          <span id="unread-dot" class="unread-dot hidden"></span>
        </button>
      </div>

      <footer class="sidebar-footer">
        <div class="current-user">
          <div id="my-avatar" class="avatar small-avatar">?</div>
          <div>
            <strong id="my-name">Forever User</strong>
            <span>Private messenger</span>
          </div>
        </div>
      </footer>
    </aside>

    <section id="chat-panel" class="chat-panel">
      <header class="chat-header">
        <button id="mobile-back-button" class="back-button" aria-label="Back to messages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>

        <div id="chat-contact-avatar" class="avatar header-avatar">?</div>
        <div class="chat-contact">
          <strong id="chat-contact-name">Loading...</strong>
          <span id="chat-status">Private conversation</span>
        </div>
      </header>

      <div id="message-scroll" class="message-scroll">
        <div id="messages" class="messages"></div>
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">♡</div>
          <h2>No messages yet</h2>
          <p>Your private conversation starts here.</p>
        </div>
      </div>

      <form id="composer" class="composer">
        <input id="image-input" class="image-input" type="file" accept="image/*,video/*,.jpg,.jpeg,.png,.gif,.webp,.heic,.heif,.mp4,.mov,.m4v,.webm" />
        <label id="add-image-button" for="image-input" class="add-image-button" aria-label="Add image" title="Add image">
          <span aria-hidden="true">+</span>
        </label>
        <div id="image-preview-wrap" class="image-preview-wrap hidden">
          <img id="image-preview" alt="Selected media preview" />
          <video id="video-preview" class="hidden" muted playsinline></video>
          <button id="remove-image-button" type="button" aria-label="Remove selected media">×</button>
        </div>
        <textarea id="message-input" rows="1" maxlength="4000" placeholder="Write a message..." aria-label="Write a message"></textarea>
        <button id="send-button" type="submit" class="send-button" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z"></path>
            <path d="M22 2 11 13"></path>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <div id="media-modal" class="media-modal hidden" role="dialog" aria-modal="true" aria-label="Media preview">
    <div class="media-modal-backdrop" data-close-media-modal></div>
    <section class="media-modal-card">
      <div class="media-modal-toolbar">
        <button id="media-close-button" class="media-modal-button" type="button" aria-label="Close preview">×</button>
        <div class="media-modal-actions">
          <button id="media-share-button" class="media-modal-button" type="button" aria-label="Share or save media" title="Share or save">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3"></path><path d="m7 8 5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
          </button>
        </div>
      </div>
      <button id="media-prev-button" class="media-nav-button media-nav-prev hidden" type="button" aria-label="Previous photo or video" title="Previous">\n        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>\n      </button>\n      <div id="media-modal-content" class="media-modal-content"></div>\n      <button id="media-next-button" class="media-nav-button media-nav-next hidden" type="button" aria-label="Next photo or video" title="Next">\n        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>\n      </button>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
          console.warn("Forever service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
